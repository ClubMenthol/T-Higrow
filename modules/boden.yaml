# ==============================================================================
# MODUL: BODEN (Version 4.9.6)
# Beinhaltet Bodenfeuchte und Leitfähigkeit (EC/Dünger)
#
# ÄNDERUNGSHISTORIE / VERSIONIERUNG:
# - Version 4.9.1: filter_out Syntax von NAN auf NAN korrigiert.
# - Version 4.9.2: FIX - Rückgabewert im Kalibrierungsmodus für Bodenfeuchte von {} auf x geändert.
# ==============================================================================
#
# ANPASSBARE VARIABLEN FÜR DIESES MODUL (Definiert in der main.yaml / secrets.yaml):
# - soil_moist_raw_dry (Rohwert trocken)
# - soil_moist_raw_wet (Rohwert nass)
# - soil_ec_raw_p0 bis p4 (Rohwerte EC-Kalibrierung)
# - soil_ec_target_p0 bis p4 (Zielwerte EC-Kalibrierung)
# - median_window, median_send_first, median_send_every (Median-Filter)
# - ma_window, ma_send_first, ma_send_every (Moving Average Filter)
# - soil_moisture_dry, soil_moisture_wet (Schwellenwerte Status-Text)
# - soil_ec_low, soil_ec_high (Schwellenwerte EC Status-Text)
# ==============================================================================
sensor:
  # --- BODENSENSOREN ---
  # Analoger Sensor für die kapazitive Bodenfeuchte
  - platform: adc
    pin: 32
    name: "Boden: 1 Feuchte"
    id: soil_moisture
    icon: "mdi:water-percent"
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: moisture
    # Triggert den Text-Sensor genau dann, wenn der Hardware-Wert frisch gefiltert gesendet wird
    on_value:
      then:
        - lambda: 'id(text_boden_status).update();'
    filters:
      - filter_out: NAN
      # Nutzt im Dauerbetrieb eine gleitende Auswertung basierend auf dem Status
      - lambda: |-
          if (id(calibration_mode).state) {
            return x;
          } else {
            float raw_dry = ${soil_moist_raw_dry};
            float raw_wet = ${soil_moist_raw_wet};
            float percent = (x - raw_dry) * (100.0 / (raw_wet - raw_dry));
            if (percent < 0.0) percent = 0.0;
            if (percent > 100.0) percent = 100.0;
            return percent;
          }
      # Filterkette Schritt 1: Extreme Fehlmessungen (Spikes) entfernen
      - median:
          window_size: ${median_window}
          send_first_at: ${median_send_first}
          send_every: ${median_send_every}

      # Filterkette Schritt 2: Verbleibende Werte glätten und Sende-Intervall drosseln
      - sliding_window_moving_average:
          window_size: ${ma_window}
          send_first_at: ${ma_send_first}
          send_every: ${ma_send_every}

  # Analoger Sensor für die elektrische Leitfähigkeit des Bodens (Düngergehalt)
  - platform: adc
    pin: 34
    name: "Boden: 3 Leitfaehigkeit (EC)"
    id: soil_ec
    icon: "mdi:lightning-bolt-outline"
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "mS/cm"
    device_class: conductivity
    on_value:
      then:
        - lambda: 'id(text_duenger_index).update();'
    filters:
      - filter_out: NAN
      # {+++ START ÄNDERUNG: Flexibles Lambda statt statischem calibrate_linear +++}
      - lambda: |-
          // Wenn der Kalibriermodus aktiv ist, gib den reinen Rohwert (x) aus
          if (id(calibration_mode).state) {
            return x;
          } else {
            // Arrays für Roh- und Zielwerte aus den Substitutions laden
            float r[] = {${soil_ec_raw_p0}, ${soil_ec_raw_p1}, ${soil_ec_raw_p2}, ${soil_ec_raw_p3}, ${soil_ec_raw_p4}};
            float t[] = {${soil_ec_target_p0}, ${soil_ec_target_p1}, ${soil_ec_target_p2}, ${soil_ec_target_p3}, ${soil_ec_target_p4}};

            // Werte außerhalb der Grenzen abfangen (Sättigung/Untersteuerung)
            if (x <= r[0]) return t[0];
            if (x >= r[4]) return t[4];

            // Stückweise lineare Interpolation zwischen den 5 Punkten (4 Intervalle)
            for (int i = 0; i < 4; i++) {
              if (x >= r[i] && x < r[i+1]) {
                // Mathematische Formel für die Steigung im aktuellen Intervall
                float divisor = r[i+1] - r[i];
                if (divisor == 0.0f) return t[i]; // Division durch 0 verhindern

                return t[i] + (x - r[i]) * ((t[i+1] - t[i]) / divisor);
              }
            }
            return 0.0; // Fallback
          }
      # {--- ENDE ÄNDERUNG ---}
      - clamp:
          min_value: 0.0
      - median:
          window_size: ${median_window}
          send_first_at: ${median_send_first}
          send_every: ${median_send_every}

      - sliding_window_moving_average:
          window_size: ${ma_window}
          send_first_at: ${ma_send_first}
          send_every: ${ma_send_every}

text_sensor:
  # Ein benutzerdefinierter Text-Sensor, der die Sensordaten auswertet
  - platform: template
    name: "Boden: 2 Status"
    id: text_boden_status
    icon: "mdi:sprout"
    update_interval: never
    lambda: |-
      if (id(calibration_mode).state) return {"KALIBRIERUNG AKTIV"};
      if (isnan(id(soil_moisture).state)) return {"Sensorfehler"};
      float m = id(soil_moisture).state;
      if (m < ${soil_moisture_dry}) return {"Zu trocken - Bitte gießen!"};
      if (m > ${soil_moisture_wet}) return {"Sehr nass"};
      return {"Optimal"};

  - platform: template
    name: "Boden: 4 Duenger-Index (EC)"
    id: text_duenger_index
    icon: "mdi:flask-outline"
    update_interval: never
    lambda: |-
      if (id(calibration_mode).state) return {"KALIBRIERUNG AKTIV"};
      if (isnan(id(soil_ec).state)) return {"Fehler"};
      float ec = id(soil_ec).state;
      if (ec < ${soil_ec_low}) return {"Zu wenig Nährstoffe"};
      if (ec > ${soil_ec_high}) return {"Achtung: Überdüngt!"};
      return {"Optimal versorgt"};
