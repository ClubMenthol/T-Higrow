# ==============================================================================
# MODUL: PFLANZEN MAPPING (Version 4.9.6)
# Zuweisung von Klarnamen basierend auf dem MAC-Suffix des Boards.
# Dieses Modul läuft vollautomatisch auf allen Boards ohne manuelle Namensänderung.
# ==============================================================================

text_sensor:
  - platform: template
    name: "Ausgewählte Pflanze"
    id: text_pflanze_name
    icon: "mdi:tag-outline"
    # Aktualisiert sich nach dem Booten und bleibt dann statisch
    update_interval: never
    lambda: |-
      ${plant_mapping_logic}
